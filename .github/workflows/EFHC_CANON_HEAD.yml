name: EFHC CANON HEAD (lock + ui typing + build)

on:
  workflow_dispatch:

jobs:
  build:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18.20.4"

      - name: Unzip project.zip
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q project.zip -d extracted

      - name: Remove any .npmrc inside extracted
        run: |
          find extracted -maxdepth 12 -name ".npmrc" -print -delete || true

      - name: Pick real frontend dir
        id: pick_frontend
        run: |
          FRONTEND_DIR=""
          while IFS= read -r d; do
            if [ -f "$d/package.json" ] && node -e "const p=require('./$d/package.json'); process.exit(p.scripts && p.scripts.build ? 0 : 1)"; then
              FRONTEND_DIR="$d"
              break
            fi
          done < <(find extracted -maxdepth 12 -type d -name frontend | sort)
          test -n "$FRONTEND_DIR"
          echo "frontend_dir=$FRONTEND_DIR" >> "$GITHUB_OUTPUT"

      - name: Force public npm registry (hard)
        run: |
          npm config set registry https://registry.npmjs.org/
          npm config delete always-auth || true
          npm config get registry

      - name: Clean poisoned lockfile + reinstall
        run: |
          cd "${{ steps.pick_frontend.outputs.frontend_dir }}"
          rm -f package-lock.json
          rm -rf node_modules
          npm install --no-audit --no-fund

      - name: Patch UI typing (DepositModal + ProfileModal)
        run: |
          FRONTEND="${{ steps.pick_frontend.outputs.frontend_dir }}"
          DEP="$FRONTEND/src/components/DepositModal.tsx"
          PRO="$FRONTEND/src/components/ProfileModal.tsx"
          test -f "$DEP"
          test -f "$PRO"

          # ---------------- DepositModal ----------------
          perl -0777 -pi -e 's/^\s*const\s+items\s*=\s*\(r\?\.\s*items\s*\|\|\s*\[\]\)\s*as\s*SalePackage\[\]\s*;\s*$/    const rr = r as unknown as { items?: SalePackage[] };\n    const items = rr.items ?? [];/m' "$DEP"

          perl -0777 -pi -e 's/^\s*const\s+tx\s*=\s*\(r\?\.\s*tonconnect_tx\s*\|\|\s*null\)\s*as\s*TonConnectTx\s*\|\s*null\s*;\s*$/    const rr_tx = r as unknown as { tonconnect_tx?: TonConnectTx | null };\n    const tx = rr_tx.tonconnect_tx ?? null;/m' "$DEP"

          # ---------------- ProfileModal ----------------
          # 1) Insert rr_wallets right after the apiRequest line (only if not already inserted)
          perl -0777 -pi -e 's/(const\s+r\s*=\s*await\s+apiRequest\(\s*["'\'']\/wallets\/me["'\'']\s*,\s*["'\'']GET["'\'']\s*\)\s*;\s*\n)(?!\s*const\s+rr_wallets\s*=)/$1    const rr_wallets = r as unknown as { wallets?: WalletItem[] };\n/m' "$PRO"

          # 2) Replace the known failing items line if present
          perl -0777 -pi -e 's/^\s*const\s+items\s*=\s*\(r\?\.\s*wallets\s*\|\|\s*\[\]\)\s*as\s*WalletItem\[\]\s*;\s*$/    const items = rr_wallets.wallets ?? [];/m' "$PRO"

          # 3) Replace ANY remaining r?.wallets usages in the file (conditions, lengths, etc.)
          perl -0777 -pi -e 's/r\?\.\s*wallets/rr_wallets.wallets/gm' "$PRO"

          echo "=== VERIFY ProfileModal ==="
          echo "--- rr_wallets lines ---"
          grep -n "rr_wallets" "$PRO" | head -n 20 || true
          echo "--- remaining r?.wallets (must be none) ---"
          if grep -n "r\\?\\.wallets" "$PRO"; then
            echo "PATCH wallets FAILED: still have r?.wallets"
            exit 2
          fi

      - name: Build
        run: |
          cd "${{ steps.pick_frontend.outputs.frontend_dir }}"
          npm run build
