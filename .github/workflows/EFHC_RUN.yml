name: EFHC RUN (unzip + canon checks) [CANON]

on:
  workflow_dispatch:

jobs:
  build:
    timeout-minutes: 55
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ---------- Node ----------
      - uses: actions/setup-node@v4
        with:
          node-version: "18.20.4"

      # ---------- Python ----------
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unzip project.zip
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q project.zip -d extracted

      - name: Remove any .npmrc inside extracted
        run: |
          find extracted -maxdepth 12 -name ".npmrc" -print -delete || true

      # ---------- Pick project root (must have tests/) ----------
      - name: Pick project root dir (tests/)
        id: pick_root
        run: |
          ROOT_DIR=""
          while IFS= read -r d; do
            if [ -d "$d/tests" ]; then
              ROOT_DIR="$d"
              break
            fi
          done < <(find extracted -maxdepth 6 -type d -print | sort)
          test -n "$ROOT_DIR"
          echo "root_dir=$ROOT_DIR" >> "$GITHUB_OUTPUT"
          echo "ROOT_DIR=$ROOT_DIR"

      # ---------- Backend ----------
      - name: Pick backend dir
        id: pick_backend
        run: |
          BACKEND_DIR="${{ steps.pick_root.outputs.root_dir }}/backend"
          test -d "$BACKEND_DIR"
          echo "backend_dir=$BACKEND_DIR" >> "$GITHUB_OUTPUT"
          echo "BACKEND_DIR=$BACKEND_DIR"

      - name: Install backend deps (pip) + pytest stack
        run: |
          cd "${{ steps.pick_backend.outputs.backend_dir }}"
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            pip install -e . || true
          fi
          # Always ensure test/runtime deps exist for our suite
          pip install -U pytest pytest-asyncio PyJWT

      - name: Backend compileall
        run: |
          cd "${{ steps.pick_backend.outputs.backend_dir }}"
          python -m compileall . -q

      - name: Backend pytest (run from project root)
        env:
          PYTHONPATH: ${{ steps.pick_root.outputs.root_dir }}/backend
        run: |
          cd "${{ steps.pick_root.outputs.root_dir }}"
          pytest -q

      # ---------- Frontend ----------
      - name: Pick real frontend dir (must have scripts.build)
        id: pick_frontend
        run: |
          FRONTEND_DIR="${{ steps.pick_root.outputs.root_dir }}/frontend"
          test -f "$FRONTEND_DIR/package.json"
          node -e "const p=require('./'+'${{ steps.pick_root.outputs.root_dir }}'+'/frontend/package.json'); process.exit(p.scripts && p.scripts.build ? 0 : 1)"
          echo "frontend_dir=$FRONTEND_DIR" >> "$GITHUB_OUTPUT"
          echo "FRONTEND_DIR=$FRONTEND_DIR"

      - name: Force public npm registry (diagnostic only)
        run: |
          npm config set registry https://registry.npmjs.org/
          npm config delete always-auth || true
          npm config get registry

      - name: Assert package-lock.json exists in HEAD
        run: |
          cd "${{ steps.pick_frontend.outputs.frontend_dir }}"
          test -f package-lock.json

      - name: Verify lockfile is clean (no internal registry)
        run: |
          cd "${{ steps.pick_frontend.outputs.frontend_dir }}"
          if grep -n "applied-caas-gateway\|internal\.api\.openai\|artifactory" package-lock.json; then
            echo "ERROR: lockfile contains internal registry"
            exit 2
          fi

      - name: Install deps (CI deterministic)
        run: |
          cd "${{ steps.pick_frontend.outputs.frontend_dir }}"
          rm -rf node_modules
          npm ci --no-audit --no-fund

      - name: Build
        run: |
          cd "${{ steps.pick_frontend.outputs.frontend_dir }}"
          npm run build
