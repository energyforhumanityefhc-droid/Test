name: EFHC RUN (unzip + npm ci + build) [CANON]

on:
  workflow_dispatch:

jobs:
  build:
    timeout-minutes: 35
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18.20.4"

      - name: Unzip project.zip
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q project.zip -d extracted

      - name: Remove any .npmrc inside extracted
        run: |
          find extracted -maxdepth 12 -name ".npmrc" -print -delete || true

      - name: Pick real frontend dir (must have scripts.build)
        id: pick_frontend
        run: |
          FRONTEND_DIR=""
          while IFS= read -r d; do
            if [ -f "$d/package.json" ] && node -e "const p=require('./$d/package.json'); process.exit(p.scripts && p.scripts.build ? 0 : 1)"; then
              FRONTEND_DIR="$d"
              break
            fi
          done < <(find extracted -maxdepth 12 -type d -name frontend | sort)
          test -n "$FRONTEND_DIR"
          echo "frontend_dir=$FRONTEND_DIR" >> "$GITHUB_OUTPUT"
          echo "FRONTEND_DIR=$FRONTEND_DIR"

      - name: Force public npm registry (diagnostic only)
        run: |
          npm config set registry https://registry.npmjs.org/
          npm config delete always-auth || true
          npm config get registry

      - name: Assert package-lock.json exists in HEAD
        run: |
          cd "${{ steps.pick_frontend.outputs.frontend_dir }}"
          test -f package-lock.json

      - name: Verify lockfile is clean (no internal registry)
        run: |
          cd "${{ steps.pick_frontend.outputs.frontend_dir }}"
          if grep -n "applied-caas-gateway\|internal\.api\.openai\|artifactory" package-lock.json; then
            echo "ERROR: lockfile contains internal registry"
            exit 2
          fi

      - name: Install deps (CI deterministic)
        run: |
          cd "${{ steps.pick_frontend.outputs.frontend_dir }}"
          rm -rf node_modules
          npm ci --no-audit --no-fund

      - name: Build
        run: |
          cd "${{ steps.pick_frontend.outputs.frontend_dir }}"
          npm run build
