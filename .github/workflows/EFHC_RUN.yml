name: EFHC CANON RUN (v147_36)

on:
  workflow_dispatch:
  push:

jobs:
  canon:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "18.20.4"

      - name: Unzip project.zip
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q project.zip -d extracted

      - name: Canon grep bans
        run: |
          cd extracted
          ! grep -RInE "telegram_id|tgId|\buid\b" . || (echo "ERROR: banned id found" && exit 3)
          ! grep -RInE "rating|reiting|raiting" . || (echo "ERROR: banned rating found" && exit 3)

      - name: Backend deps + pytest
        run: |
          cd extracted/backend
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -U pytest pytest-asyncio PyJWT aiosqlite

      - name: Backend tests
        env:
          PYTHONPATH: ${{ github.workspace }}/extracted
        run: |
          cd extracted
          python -m compileall backend -q
          pytest -q

      - name: Frontend lockfile must be clean
        run: |
          cd extracted/frontend
          test -f package-lock.json
          if grep -n "applied-caas-gateway\|internal\.api\.openai\|artifactory" package-lock.json; then
            echo "ERROR: lockfile contains internal registry"
            exit 2
          fi

      - name: Frontend build
        run: |
          cd extracted/frontend
          npm config set registry https://registry.npmjs.org/
          rm -rf node_modules
          npm ci --no-audit --no-fund
          npm run build
