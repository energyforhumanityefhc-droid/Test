name: UNZIP ONLY (project.zip)

on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: List repo files
        run: |
          ls -la

      - name: Unzip project.zip
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q project.zip -d extracted
          echo "=== OK: unzip completed ==="
          echo "=== extracted top level ==="
          ls -la extracted
          echo "=== first 200 paths ==="
          find extracted -maxdepth 6 -print | head -n 200

      - name: Pack extracted to artifact zip
        run: |
          cd extracted
          zip -qr ../extracted.zip .
          cd ..

      - name: Upload extracted artifact
        uses: actions/upload-artifact@v4
        with:
          name: extracted_zip
          path: extracted.zip
