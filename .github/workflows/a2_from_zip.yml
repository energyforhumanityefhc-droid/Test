name: A2 from ZIP (lock + build)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: List repo files
        run: ls -la

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Unzip project
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q project.zip -d extracted
          echo "=== extracted top ==="
          ls -la extracted
          echo "=== find frontend dirs ==="
          find extracted -maxdepth 12 -type d -name frontend -print

      - name: Remove any .npmrc inside extracted
        run: |
          find extracted -maxdepth 12 -name ".npmrc" -print -delete || true

      - name: Force public npm registry
        run: |
          npm config set registry https://registry.npmjs.org/
          npm config delete always-auth || true
          npm config get registry

      - name: Generate lockfile + build (pick real frontend)
        run: |
          echo "=== Candidate frontend dirs ==="
          find extracted -maxdepth 12 -type d -name frontend -print

          FRONTEND_DIR=""
          while IFS= read -r d; do
            if [ -f "$d/package.json" ] && node -e "const p=require('./$d/package.json'); process.exit(p.scripts&&p.scripts.build?0:1)"; then
              FRONTEND_DIR="$d"
              break
            fi
          done < <(find extracted -maxdepth 12 -type d -name frontend | sort)

          echo "FRONTEND_DIR=$FRONTEND_DIR"
          test -n "$FRONTEND_DIR"

          cd "$FRONTEND_DIR"
          rm -f package-lock.json
          rm -rf node_modules
          npm install @tonconnect/ui-react@2.4.0 --save-exact
          npm ci
          npm run build

      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: a2_lockfile
          path: extracted/**/frontend/package-lock.json
