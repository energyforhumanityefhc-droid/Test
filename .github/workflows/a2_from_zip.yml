name: A2 from ZIP (lock + build)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Unzip project.zip
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q project.zip -d extracted
          echo "=== candidate frontend dirs ==="
          find extracted -maxdepth 12 -type d -name frontend -print

      - name: Remove any .npmrc inside extracted
        run: |
          find extracted -maxdepth 12 -name ".npmrc" -print -delete || true

      - name: Force public npm registry
        run: |
          npm config set registry https://registry.npmjs.org/
          npm config delete always-auth || true
          npm config get registry

      - name: Pick real frontend dir (must have scripts.build)
        id: pick_frontend
        run: |
          FRONTEND_DIR=""
          while IFS= read -r d; do
            if [ -f "$d/package.json" ] && node -e "const p=require('./$d/package.json'); process.exit(p.scripts && p.scripts.build ? 0 : 1)"; then
              FRONTEND_DIR="$d"
              break
            fi
          done < <(find extracted -maxdepth 12 -type d -name frontend | sort)
          echo "FRONTEND_DIR=$FRONTEND_DIR"
          test -n "$FRONTEND_DIR"
          echo "frontend_dir=$FRONTEND_DIR" >> "$GITHUB_OUTPUT"

      - name: Patch DepositModal.tsx TS (items) via Python
        run: |
          FRONTEND_DIR="${{ steps.pick_frontend.outputs.frontend_dir }}"
          FILE="$FRONTEND_DIR/src/components/DepositModal.tsx"
          echo "PATCH_FILE=$FILE"
          test -f "$FILE"

          python - <<'PY'
from pathlib import Path

path = Path("${FILE}")
s = path.read_text(encoding="utf-8")

old = "const items = (r?.items || []) as SalePackage[];"
new = "const rr = r as unknown as { items?: SalePackage[] };\n    const items = rr.items ?? [];"

if old not in s:
    raise SystemExit(f"Expected line not found in {path}")

s2 = s.replace(old, new, 1)
path.write_text(s2, encoding="utf-8")
print("Patched OK")
PY

          echo "=== patched preview ==="
          grep -n "const rr = r as unknown as" "$FILE" || true

      - name: Generate lockfile + install + build
        run: |
          cd "${{ steps.pick_frontend.outputs.frontend_dir }}"
          rm -f package-lock.json
          rm -rf node_modules
          npm install @tonconnect/ui-react@2.4.0 --save-exact
          npm ci
          npm run build

      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: a2_lockfile
          path: ${{ steps.pick_frontend.outputs.frontend_dir }}/package-lock.json
