name: canon

on:
  push:
  pull_request:

jobs:
  canon:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: efhc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d efhc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/efhc_test
      SYNC_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/efhc_test
      ASYNC_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/efhc_test
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_PYTHON_VERSION_WARNING: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Guard DB profile (Postgres-only)
        run: |
          python - <<'PY'
          import os, sys
          url = os.environ.get("DATABASE_URL")
          print("DATABASE_URL present:", bool(url), "len:", 0 if url is None else len(url))
          if not url:
            print("ERROR: DATABASE_URL is empty")
            sys.exit(2)
          if url.lower().startswith("sqlite://"):
            print("ERROR: SQLite is forbidden by CANON")
            sys.exit(3)
          print("OK: Postgres-only profile")
          PY

      - name: Ensure project.zip exists in repo root (canon)
        run: |
          set -e
          if [ -f project.zip ]; then
            echo "OK: project.zip exists"
            exit 0
          fi

          echo "WARN: project.zip not found in repo root"
          echo "Root directory listing:"
          ls -la

          CANDIDATE="$(ls -1 EFHC_Bot_*.zip 2>/dev/null | head -n 1 || true)"
          if [ -n "$CANDIDATE" ]; then
            echo "Found candidate zip: $CANDIDATE"
            cp "$CANDIDATE" project.zip
            echo "Created project.zip from $CANDIDATE"
            ls -la project.zip
            exit 0
          fi

          echo "ERROR: project.zip not found and no EFHC_Bot_*.zip candidate present"
          exit 1

      - name: Unzip project.zip
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q project.zip -d extracted
          find extracted -maxdepth 12 -name ".npmrc" -print -delete || true

      - name: Guard grep bans (repo-wide in extracted)
        run: |
          set -e
          cd extracted
          python - <<'PY'
          import os, re, sys
          banned = [
            ("telegram_id", re.compile(r"telegram_id", re.IGNORECASE)),
            ("rating|reiting|raiting", re.compile(r"rating|reiting|raiting", re.IGNORECASE)),
            ("tgId (not tg_id)", re.compile(r"\btgId\b", re.IGNORECASE)),
            ("\\buid\\b", re.compile(r"\buid\b", re.IGNORECASE)),
          ]
          hits = []
          for root, _, files in os.walk("."):
            for fn in files:
              path = os.path.join(root, fn)
              try:
                with open(path, "rb") as f:
                  data = f.read()
              except Exception:
                continue
              try:
                text = data.decode("utf-8", errors="replace")
              except Exception:
                continue
              for name, rx in banned:
                m = rx.search(text)
                if m:
                  hits.append((name, path, m.start()))
          if hits:
            print("ERROR: forbidden identifiers found:")
            for name, path, pos in hits[:50]:
              print(f"- {name}: {path} @ {pos}")
            sys.exit(1)
          print("OK: bans check passed")
          PY

      - name: Backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r extracted/backend/requirements.txt

      - name: compileall (backend)
        run: |
          python -m compileall extracted/backend -q

      - name: Alembic upgrade head (Postgres-only)
        run: |
          cd extracted/backend
          alembic -c alembic.ini upgrade head

      - name: pytest (Postgres-only)
        run: |
          cd extracted
          pytest -q

      - name: Frontend lockfile checks + build
        run: |
          set -e
          test -f extracted/frontend/package-lock.json || (echo "ERROR: package-lock.json missing" && exit 1)

          if grep -RInE "applied-caas-gateway|internal\.api\.openai|artifactory" extracted/frontend/package-lock.json; then
            echo "ERROR: forbidden registry markers in package-lock.json"
            exit 1
          fi

          cd extracted/frontend
          npm ci
          npm run build
