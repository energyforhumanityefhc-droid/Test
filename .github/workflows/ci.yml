name: EFHC CI (Postgres-only CANON, ZIP in repo)

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  canon:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: efhc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d efhc_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      # CANON: Postgres-only. SQLite forbidden.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/efhc_test
      SYNC_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/efhc_test
      ASYNC_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/efhc_test

      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_PYTHON_VERSION_WARNING: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "18.20.4"

      - name: Guard DB profile (Postgres-only)
        run: |
          python - <<'PY'
          import os, sys
          url = os.environ.get("DATABASE_URL")
          print("DATABASE_URL present:", bool(url), "len:", 0 if url is None else len(url))
          if not url:
            print("ERROR: DATABASE_URL is empty")
            sys.exit(2)
          if url.lower().startswith("sqlite://"):
            print("ERROR: SQLite is forbidden by CANON")
            sys.exit(3)
          print("OK: Postgres-only profile")
          PY

      - name: Unzip project.zip
        run: |
          test -f project.zip || (echo "ERROR: project.zip not found in repo root" && exit 1)
          rm -rf extracted
          mkdir -p extracted
          unzip -q project.zip -d extracted
          find extracted -maxdepth 12 -name ".npmrc" -print -delete || true

      - name: Verify extracted structure
        run: |
          test -d extracted/backend
          test -d extracted/frontend
          test -d extracted/tests

      - name: Canon bans scan (text-only, no forbidden literals in workflow)
        run: |
          python - <<'PY'
          import os, re, sys

          # Build forbidden tokens WITHOUT placing them literally in this workflow file.
          tok_telegram_id = "tele" + "gram" + "_" + "id"
          tok_tgId = "tg" + "Id"
          tok_rating = "rat" + "ing"
          tok_reiting = "rei" + "ting"
          tok_raiting = "rai" + "ting"

          # Word boundary uid without literal \buid\b sequence in file
          uid_word = r"\b" + "uid" + r"\b"

          rx_banned_ids = re.compile(rf"({tok_telegram_id}|{tok_tgId}|{uid_word})", re.IGNORECASE)
          rx_banned_rating = re.compile(rf"({tok_rating}|{tok_reiting}|{tok_raiting})", re.IGNORECASE)

          # Binary skip: extensions + NUL byte sniff
          skip_ext = {
            ".png",".jpg",".jpeg",".gif",".webp",".ico",".pdf",
            ".zip",".gz",".bz2",".7z",".rar",
            ".woff",".woff2",".ttf",".otf",".eot",
            ".mp3",".mp4",".mov",".avi",".mkv",
            ".bin",".exe",".dll",".so",".dylib"
          }

          hits = []

          root = "extracted"
          for dirpath, _, filenames in os.walk(root):
            for fn in filenames:
              path = os.path.join(dirpath, fn)
              _, ext = os.path.splitext(fn.lower())
              if ext in skip_ext:
                continue

              try:
                with open(path, "rb") as f:
                  chunk = f.read(4096)
                  if b"\x00" in chunk:
                    continue  # likely binary
                  data = chunk + f.read()
              except Exception:
                continue

              text = data.decode("utf-8", errors="replace")

              for rx, label in [(rx_banned_ids, "banned_ids"), (rx_banned_rating, "banned_rating")]:
                m = rx.search(text)
                if m:
                  # compute line/col
                  before = text[:m.start()]
                  line = before.count("\n") + 1
                  col = m.start() - (before.rfind("\n") + 1)
                  frag = text[m.start():m.start()+80].replace("\n","\\n")
                  hits.append((label, path, line, col, frag))

          if hits:
            print("ERROR: forbidden tokens detected (text-only scan):")
            for label, path, line, col, frag in hits[:200]:
              print(f"- {label}: {path}:{line}:{col}: {frag}")
            sys.exit(3)

          print("OK: canon bans scan passed (text-only).")
          PY

      # ---------------- Backend ----------------
      - name: Install backend deps (pip)
        run: |
          python -m pip install --upgrade pip
          if [ -f extracted/backend/requirements.txt ]; then
            pip install -r extracted/backend/requirements.txt
          fi
          pip install -U pytest pytest-asyncio alembic "psycopg[binary]" PyJWT
          python -m pip install flake8==7.1.1

      - name: Lint (flake8)
        run: |
          cd extracted
          TARGETS=""
          [ -d backend ] && TARGETS="$TARGETS backend"
          [ -d tests ] && TARGETS="$TARGETS tests"
          [ -d ops ] && TARGETS="$TARGETS ops"
          test -n "$TARGETS"
          flake8 $TARGETS --exclude=.pytest_cache,__pycache__

      - name: Backend compileall
        run: |
          python -m compileall extracted/backend -q

      - name: Alembic upgrade head (Postgres)
        run: |
          cd extracted
          test -f backend/alembic.ini
          alembic -c backend/alembic.ini upgrade head

      - name: Pytest (Postgres-only)
        env:
          PYTHONPATH: ${{ github.workspace }}/extracted
        run: |
          cd extracted
          pytest -q

      # ---------------- Frontend ----------------
      - name: Frontend lockfile must be clean (no internal registry)
        run: |
          cd extracted/frontend
          test -f package-lock.json
          if grep -n "applied-caas-gateway\|internal\.api\.openai\|artifactory" package-lock.json; then
            echo "ERROR: lockfile contains internal registry"
            exit 2
          fi

      - name: Frontend npm ci
        run: |
          cd extracted/frontend
          npm config set registry https://registry.npmjs.org/
          rm -rf node_modules
          npm ci --no-audit --no-fund

      - name: Frontend build
        run: |
          cd extracted/frontend
          npm run build
