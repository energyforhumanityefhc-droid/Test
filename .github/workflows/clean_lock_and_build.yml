name: CLEAN LOCKFILE + BUILD (public registry)

on:
  workflow_dispatch:

jobs:
  build:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18.20.4"

      - name: Unzip project.zip
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q project.zip -d extracted

      - name: Remove any .npmrc inside extracted
        run: |
          find extracted -maxdepth 12 -name ".npmrc" -print -delete || true

      - name: Pick real frontend dir
        id: pick_frontend
        run: |
          FRONTEND_DIR=""
          while IFS= read -r d; do
            if [ -f "$d/package.json" ] && node -e "const p=require('./$d/package.json'); process.exit(p.scripts && p.scripts.build ? 0 : 1)"; then
              FRONTEND_DIR="$d"
              break
            fi
          done < <(find extracted -maxdepth 12 -type d -name frontend | sort)
          test -n "$FRONTEND_DIR"
          echo "frontend_dir=$FRONTEND_DIR" >> "$GITHUB_OUTPUT"
          echo "FRONTEND_DIR=$FRONTEND_DIR"

      - name: Force public npm registry (hard)
        run: |
          npm config set registry https://registry.npmjs.org/
          npm config delete always-auth || true
          npm config get registry

      - name: Clean poisoned lockfile (remove internal resolved)
        run: |
          cd "${{ steps.pick_frontend.outputs.frontend_dir }}"
          echo "=== checking lockfile for internal registry ==="
          (grep -n "applied-caas-gateway\|internal\.api\.openai" package-lock.json && echo "FOUND internal resolved") || echo "OK (not found)"
          rm -f package-lock.json
          rm -rf node_modules

      - name: Install deps (regenerate lockfile)
        run: |
          cd "${{ steps.pick_frontend.outputs.frontend_dir }}"
          npm install --no-audit --no-fund

      - name: Verify lockfile is clean
        run: |
          cd "${{ steps.pick_frontend.outputs.frontend_dir }}"
          if grep -n "applied-caas-gateway\|internal\.api\.openai" package-lock.json; then
            echo "ERROR: lockfile still contains internal registry"
            exit 2
          fi
          grep -n "registry.npmjs.org" package-lock.json | head -n 5 || true

      - name: Build
        run: |
          cd "${{ steps.pick_frontend.outputs.frontend_dir }}"
          npm run build

      - name: Upload clean lockfile
        uses: actions/upload-artifact@v4
        with:
          name: clean_package_lock
          path: ${{ steps.pick_frontend.outputs.frontend_dir }}/package-lock.json
