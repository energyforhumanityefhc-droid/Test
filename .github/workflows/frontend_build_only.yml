name: FRONTEND BUILD ONLY (stable npm)

on:
  workflow_dispatch:

jobs:
  build:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project.zip
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q project.zip -d extracted

      - name: Remove any .npmrc inside extracted
        run: |
          find extracted -maxdepth 12 -name ".npmrc" -print -delete || true

      - name: Pick real frontend dir
        id: pick_frontend
        run: |
          FRONTEND_DIR=""
          while IFS= read -r d; do
            if [ -f "$d/package.json" ] && node -e "const p=require('./$d/package.json'); process.exit(p.scripts && p.scripts.build ? 0 : 1)"; then
              FRONTEND_DIR="$d"
              break
            fi
          done < <(find extracted -maxdepth 12 -type d -name frontend | sort)
          test -n "$FRONTEND_DIR"
          echo "frontend_dir=$FRONTEND_DIR" >> "$GITHUB_OUTPUT"
          echo "FRONTEND_DIR=$FRONTEND_DIR"

      - uses: actions/setup-node@v4
        with:
          node-version: "18.20.4"
          cache: "npm"
          cache-dependency-path: ${{ steps.pick_frontend.outputs.frontend_dir }}/package-lock.json

      - name: Force public npm registry
        run: |
          npm config set registry https://registry.npmjs.org/
          npm config delete always-auth || true
          npm config get registry

      - name: Pin npm to stable (workaround Exit handler never called)
        run: |
          node -v
          npm -v
          npm i -g npm@9.9.4
          npm -v

      - name: Install deps (npm ci with retry)
        run: |
          set -euo pipefail
          cd "${{ steps.pick_frontend.outputs.frontend_dir }}"

          echo "== build script =="
          node -e "const p=require('./package.json'); console.log(p.scripts && p.scripts.build ? p.scripts.build : 'NO build script');"

          echo "== npm ci attempt 1 =="
          npm ci --no-audit --no-fund || (
            echo "npm ci failed, cleaning cache and retrying..." &&
            npm cache clean --force &&
            rm -rf node_modules &&
            echo "== npm ci attempt 2 ==" &&
            npm ci --no-audit --no-fund
          )

          echo "== verify next exists =="
          test -f node_modules/.bin/next || (echo "ERROR: next binary not found" && ls -la node_modules/.bin || true && exit 2)

      - name: Build
        run: |
          set -euo pipefail
          cd "${{ steps.pick_frontend.outputs.frontend_dir }}"
          npm run build
